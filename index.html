<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- EDIT: description for search/social -->
  <meta name="description" content="Static client-side reference app. Runs entirely in your browser.">
  <!-- Title is set from SITE.name in js/data.js at load -->
  <title>Static SPA Template</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="masthead">
    <div class="msg-strip">
      <span class="msg-field" id="strip-left"></span>
      <span class="msg-field strip-right" id="strip-right"></span>
    </div>
    <h1 class="site-title"><span id="site-name"></span><span class="title-sub" id="site-tagline"></span></h1>
    <nav class="tabs" id="nav" aria-label="Primary"></nav>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer"><p id="footer-text"></p></footer>

  <script src="js/data.js"></script>
  <script src="js/custom.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
